<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zai2api — Login</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-card">
        <h1>zai2api Dashboard</h1>
        <p>Enter your dashboard token to continue.</p>
        {{if .Error}}
            <div class="login-error">Invalid token. Please try again.</div>
        {{end}}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Dashboard Token</label>
                <input type="password" name="token" autofocus required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
        </form>
    </div>
</body>
</html>
